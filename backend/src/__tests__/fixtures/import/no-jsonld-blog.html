<head><title>Grandma's Chili</title></head>
<body>
<h1>Grandma's Chili</h1>
<p>Serves 6</p>
<h2>Ingredients</h2>
<ul>
<li>2 lbs ground beef</li>
<li>1 can kidney beans</li>
<li>1 onion, diced</li>
</ul>
<h2>Instructions</h2>
<ol>
<li>Brown the ground beef in a large pot.</li>
<li>Add the beans and onion, then simmer for 45 minutes.</li>
</ol>
</body>
