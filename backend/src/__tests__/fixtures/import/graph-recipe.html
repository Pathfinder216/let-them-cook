<!doctype html>
<html>
<head>
<title>Graph Banana Bread</title>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    { "@type": "WebSite", "name": "Example Recipes" },
    { "@type": "ImageObject", "url": "https://example.com/banana-bread.jpg" },
    {
      "@type": "Recipe",
      "name": "Graph Banana Bread",
      "recipeYield": 8,
      "totalTime": "PT1H",
      "recipeIngredient": [
        "3 ripe bananas",
        "2 cups flour",
        "1/2 cup sugar"
      ],
      "recipeInstructions": [
        { "@type": "HowToStep", "text": "Mash the bananas." },
        { "@type": "HowToStep", "text": "Mix in the flour and sugar." },
        { "@type": "HowToStep", "text": "Bake at 350F for 50 minutes." }
      ]
    }
  ]
}
</script>
</head>
<body><h1>Graph Banana Bread</h1></body>
</html>
