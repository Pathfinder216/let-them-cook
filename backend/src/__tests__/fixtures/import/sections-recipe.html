<!doctype html>
<html>
<head>
<title>Layered Trifle</title>
<script type="application/ld+json">
{
  "@type": "Recipe",
  "name": "Layered Trifle",
  "recipeYield": "10 servings",
  "recipeIngredient": [
    "2 cups sponge cake, cubed",
    "1 cup custard",
    "1 cup whipped cream"
  ],
  "recipeInstructions": [
    {
      "@type": "HowToSection",
      "name": "Custard",
      "itemListElement": [
        { "@type": "HowToStep", "text": "Whisk the custard until smooth." },
        { "@type": "HowToStep", "text": "Chill the custard for 1 hour." }
      ]
    },
    {
      "@type": "HowToSection",
      "name": "Assembly",
      "itemListElement": [
        { "@type": "HowToStep", "text": "Layer cake, custard, and cream in a bowl." },
        { "@type": "HowToStep", "text": "Repeat the layers and chill before serving." }
      ]
    }
  ]
}
</script>
</head>
<body><h1>Layered Trifle</h1></body>
</html>
